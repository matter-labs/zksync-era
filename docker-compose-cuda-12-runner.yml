version: '3.2'
# Same CUDA 12 toolchain image as `docker-compose-gpu-runner-cuda-12-0.yml`, but WITHOUT any
# nvidia device forwarding / GPU reservation. Compiling CUDA code (nvcc) needs the toolkit that
# ships in the image, not a physical GPU — so this lets build-only jobs run on plain CPU runners
# (e.g. matterlabs-ci-runner-high-performance) where `/dev/nvidia*` does not exist and the
# GPU-reserving compose file would fail to start the container. Do NOT use this to *run* the
# prover: launching CUDA kernels still requires a GPU (use the gpu-runner compose file for that).
services:
  reth:
    restart: always
    image: "ghcr.io/paradigmxyz/reth:v1.8.2"
    ports:
      - 127.0.0.1:8545:8545
    volumes:
      - type: volume
        source: reth-data
        target: /rethdata
      - type: bind
        source: ./etc/reth/chaindata
        target: /chaindata

    command: node --dev --datadir /rethdata --http --http.addr 0.0.0.0 --http.port 8545 --http.corsdomain "*" --dev.block-time 300ms --chain /chaindata/reth_config

  zk:
    image: ghcr.io/matter-labs/zk-environment:cuda-12-latest
    depends_on:
      - reth
      - postgres
    security_opt:
      - seccomp:unconfined
    command: tail -f /dev/null
    volumes:
      - .:/usr/src/zksync
      - /usr/src/cache:/usr/src/cache
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/src/keys:/mnt/prover_setup_keys
    env_file:
      - ./.env
    extra_hosts:
      - "host:host-gateway"
    profiles:
      - runner
    network_mode: host
    pid: host

  postgres:
    image: "postgres:18"
    command: postgres -c 'max_connections=200'
    ports:
      - 127.0.0.1:5432:5432
    environment:
      # We bind only to 127.0.0.1, so setting insecure password is acceptable here
      - POSTGRES_PASSWORD=notsecurepassword

volumes:
  postgres-data:
  reth-data:
