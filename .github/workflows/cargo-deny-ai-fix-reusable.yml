# Reusable workflow: cargo-deny AI auto-fix
#
# WHERE THIS LIVES:
#   This is the canonical copy of the reusable workflow. It currently lives in
#   zksync-era so the caller (cargo-deny-ai-fix.yml, same directory) can reference it
#   via a local path and the whole system works out of the box. Long-term, move this
#   file to matter-labs/zksync-ci-common and reference it from every caller pinned to
#   a reviewed FULL COMMIT SHA — never a branch:
#     uses: matter-labs/zksync-ci-common/.github/workflows/cargo-deny-ai-fix-reusable.yml@<full-sha>
#   (A branch ref like @main would let any later change to the central workflow run
#   with every caller's secrets and write permissions without review.)
#
# WHAT IT DOES:
#   1. detect  -> runs `cargo deny check` (same pinned 0.18.6 the PR-time gate's action
#                 bundles) and fingerprints the failing finding set. Skips the fix if a
#                 fix PR is open, or a diagnosis issue with the SAME fingerprint is open
#                 (a changed finding set re-arms it, so an old human-pending issue never
#                 suppresses new fixable findings). Closes stale diagnosis issues when
#                 the check is green again.
#   2. ai-fix  -> READ-ONLY job, no publishing credential anywhere on the runner.
#                 Claude gets file edits + cargo + scoped git subcommands (no gh, no
#                 rustup), commits fixes locally, and writes a report; the job uploads
#                 patches + report as an artifact.
#   3. publish -> separate job on a FRESH runner (nothing untrusted ever ran here — a
#                 malicious build script in ai-fix can't have planted git hooks or
#                 background processes). Validates the patches only touch the workspace
#                 (or its deny.toml policy file), applies them with hooks disabled,
#                 pushes, and opens a PR — or opens/updates a fingerprinted diagnosis
#                 issue when there are no commits (human-only findings, or dry-run).
#                 Never merges anything.
#
# TOKENS / CREDENTIAL ISOLATION:
#   Rust build scripts and proc macros execute arbitrary code during `cargo build`/
#   `cargo test`, and code that has run on a runner can persist processes or install
#   git hooks — so introducing a credential later in the SAME job is not isolation.
#   Hence the job split: the ai-fix job holds no publishing credential and its
#   GITHUB_TOKEN is read-only (contents: read); the publishing credential exists only
#   in the publish job, on a runner where no untrusted code has executed.
#   Credential preference:
#     1. GH_APP_ID + GH_APP_PRIVATE_KEY  - a repository-scoped GitHub App; a short-lived
#        installation token is minted inside the publish job (recommended).
#     2. GH_PAT                          - long-lived bot PAT fallback (in matter-labs
#        repos, the same PAT release-please uses: RELEASE_TOKEN).
#   Either way, PRs/issues come from the bot identity and fix PRs trigger CI (events
#   from the default GITHUB_TOKEN don't).
#
# CONVENTIONS ALIGNED WITH `AI Security Review` (zksync-prividium):
#   - All third-party actions are pinned to full commit SHAs (tag noted in a comment);
#     Renovate's pinGitHubActionDigests preset keeps them current.
#   - `model` is pinned explicitly rather than left on the action's default, same as
#     `claude-model: claude-opus-4-7` there.
#   - A per-repo instructions file is supported (parallel to
#     `.github/security-review-focus.md`) so each repo can extend the prompt without
#     forking this workflow - see `extra-instructions-path` below.
#   - No sticky-comment infra-failure handling is needed here the way the PR-triggered
#     security review needs it: this workflow re-runs on a schedule, so a transient
#     failure (e.g. a 529 from the API) just gets retried automatically next run,
#     since the detect job will still see red + nothing open.
#
# REQUIRED SECRETS (pass explicitly from the caller):
#   ANTHROPIC_API_KEY                  - or CLAUDE_CODE_OAUTH_TOKEN, see claude-code-action docs
#   GH_APP_ID + GH_APP_PRIVATE_KEY     - preferred publishing credential (or:)
#   GH_PAT                             - fallback publishing credential
#
# REQUIRED REPO SETUP:
#   - A `deny.toml` in the repo: either next to the workspace `manifest-path` points at
#     (auto-discovered), or a shared one passed explicitly via `--config` in the
#     `deny-action-args` input (cargo-deny does NOT auto-discover a root config from
#     nested workspaces, and a relative --config path resolves from the workspace root
#     directory — e.g. '--config ../deny.toml' for a repo-root config with one-level-deep
#     workspaces).
#   - Labels are self-created by the publish job on first run (`gh label create ... || true`).
#   - If several workspaces share one deny.toml, serialize the caller's matrix with
#     `strategy.max-parallel: 1` so concurrent runs can't produce conflicting policy
#     edits. (Don't give matrix entries the same concurrency group instead: GitHub
#     keeps at most ONE pending run per group and silently drops the rest.)
#
# RECOMMENDED ROLLOUT: set `dry-run: true` in the caller for the first 1-2 weeks on a
# repo you haven't run this on before, especially a regulated/customer-facing one like
# zksync-prividium. In dry-run mode, Claude still diagnoses everything but the workflow
# publishes a tracking issue (not a PR, no commits) so you can sanity-check its
# reasoning before it starts touching Cargo.lock / deny.toml directly. Flip to false
# once you trust it.

name: Cargo Deny AI Fix

on:
  workflow_call:
    inputs:
      manifest-path:
        description: "Path to the Cargo.toml of the workspace to check (e.g. 'core/Cargo.toml')"
        required: true
        type: string
      deny-arguments:
        description: "Top-level cargo-deny arguments placed before the subcommand (default --all-features)."
        required: false
        type: string
        default: "--all-features"
      deny-action-args:
        description: "Extra arguments passed to the cargo-deny check subcommand. Use this to point at a shared config, e.g. '--config ../deny.toml' (in cargo-deny 0.18.x a relative --config resolves from the workspace root directory, not the cwd)."
        required: false
        type: string
        default: "--hide-inclusion-graph"
      concurrency-key:
        description: "Overrides the concurrency group key (default: the manifest path). CAUTION: GitHub keeps at most one running and one pending run per group — giving several matrix entries the same key silently drops queued ones. To serialize workspaces that share a deny.toml, prefer strategy.max-parallel: 1 in the caller."
        required: false
        type: string
        default: ""
      max-turns:
        description: "Max agentic turns Claude gets to resolve findings before giving up"
        required: false
        type: number
        default: 25
      model:
        description: "Claude model to pin for this task (explicit, not left on the action's default)"
        required: false
        type: string
        default: "claude-sonnet-5"
      extra-instructions-path:
        description: "Optional repo-relative path to a markdown file with repo-specific instructions, appended to the prompt if it exists"
        required: false
        type: string
        default: ".github/cargo-deny-fix-focus.md"
      dry-run:
        description: "If true, Claude diagnoses and the workflow opens a tracking issue instead of a PR - no commits, no branch. Recommended for the first runs on a new repo."
        required: false
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      GH_APP_ID:
        description: "GitHub App ID for minting a short-lived, repository-scoped installation token used by the publish job to push branches and open PRs/issues (preferred over GH_PAT). The app needs contents, pull-requests and issues write permissions."
        required: false
      GH_APP_PRIVATE_KEY:
        description: "Private key for the GH_APP_ID app."
        required: false
      GH_PAT:
        description: "Fallback publishing credential: a bot PAT (in matter-labs repos, the same PAT release-please uses: RELEASE_TOKEN). Used only if the GitHub App secrets are not provided."
        required: false

concurrency:
  group: cargo-deny-ai-fix-${{ github.repository }}-${{ inputs.concurrency-key != '' && inputs.concurrency-key || inputs.manifest-path }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write # closes stale diagnosis issues when the check is green again
    outputs:
      should_fix: ${{ steps.gate.outputs.should_fix }}
      workspace_slug: ${{ steps.slug.outputs.slug }}
      workspace_dir: ${{ steps.slug.outputs.dir }}
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Derive a workspace slug from the manifest path
        id: slug
        run: |
          # 'core/Cargo.toml' -> 'core', 'zkstack_cli/Cargo.toml' -> 'zkstack_cli', bare 'Cargo.toml' -> 'root'
          raw="${{ inputs.manifest-path }}"
          dir="$(dirname "$raw")"
          slug="${dir//\//-}"
          [[ "$slug" == "." ]] && slug="root"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Same cargo-deny version the PR-time gate's action bundles (cargo-deny-action
      # v2.0.11 ships 0.18.6 — see its Dockerfile), so both checks agree on what is
      # red. The raw CLI (invoked as `cargo-deny`, not through the cargo shim, to
      # avoid pulling the repo's pinned nightly here) is used instead of the action so
      # the machine-readable diagnostics can be fingerprinted. Bump together with the
      # ai-fix job's pin below.
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-deny@0.18.6

      - name: Run cargo-deny check
        id: deny
        run: |
          set +e
          cargo-deny --manifest-path "${{ inputs.manifest-path }}" ${{ inputs.deny-arguments }} --format json \
            check ${{ inputs.deny-action-args }} 2> /tmp/deny-diagnostics.jsonl
          code=$?
          set -e
          echo "failed=$([[ $code -ne 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Human-readable summary for the run log
          jq -r 'select(.type=="diagnostic") | "\(.fields.severity): [\(.fields.code // "-")] \(.fields.advisory.id // "") \(.fields.message // "")"' \
            /tmp/deny-diagnostics.jsonl | sort | uniq -c | sort -rn || true

      # Stable identity of the failing finding set: the complete normalized error
      # diagnostics (keys sorted via jq -S), order-normalized but with multiplicity
      # preserved (`sort` WITHOUT -u). License rejections all share one
      # (code, message) pair in 0.18.x, so hashing a deduplicated summary would let a
      # newly added disallowed dependency hide behind an already-open diagnosis
      # issue; hashing full diagnostics (labels, notes, graphs) distinguishes them.
      # Volatile detail (e.g. lockfile line numbers in labels) can shift the
      # fingerprint on unrelated changes — that errs toward a redundant re-run,
      # never toward suppression.
      - name: Fingerprint the failing finding set
        id: fp
        if: steps.deny.outputs.failed == 'true'
        run: |
          fp=$(jq -cS 'select(.type=="diagnostic" and .fields.severity=="error") | .fields' \
                /tmp/deny-diagnostics.jsonl | LC_ALL=C sort | sha256sum | cut -d' ' -f1)
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

      # Dedup against both artifacts this workflow produces. A fix PR blocks re-runs
      # until merged/closed. A diagnosis issue blocks re-runs ONLY while its embedded
      # fingerprint matches the current finding set — new findings re-arm the
      # workflow and refresh the issue, so a months-open human decision can't
      # suppress newly introduced fixable vulnerabilities.
      - name: Check for an already-open fix PR or up-to-date diagnosis issue
        id: existing
        if: steps.deny.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_count=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --label "cargo-deny-fix" --label "workspace:${{ steps.slug.outputs.slug }}" \
            --json number --jq 'length')
          echo "pr_count=$pr_count" >> "$GITHUB_OUTPUT"
          issue_number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label "cargo-deny-diagnosis" --label "workspace:${{ steps.slug.outputs.slug }}" \
            --json number --jq '.[0].number // empty')
          issue_fp=""
          if [[ -n "$issue_number" ]]; then
            issue_fp=$(gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
              | sed -n 's/.*<!-- cargo-deny-fingerprint: \([0-9a-f]\{64\}\) -->.*/\1/p' | head -n1)
          fi
          echo "issue_fp=$issue_fp" >> "$GITHUB_OUTPUT"

      - name: Close stale diagnosis issue when the check is green
        if: steps.deny.outputs.failed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label "cargo-deny-diagnosis" --label "workspace:${{ steps.slug.outputs.slug }}" \
            --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "cargo-deny is green again for \`${{ inputs.manifest-path }}\` — closing."
          fi

      - name: Decide whether the fix job should run
        id: gate
        run: |
          is_red="${{ steps.deny.outputs.failed }}"
          pr_count="${{ steps.existing.outputs.pr_count }}"
          issue_fp="${{ steps.existing.outputs.issue_fp }}"
          current_fp="${{ steps.fp.outputs.fingerprint }}"
          should=false
          if [[ "$is_red" == "true" && "${pr_count:-0}" == "0" ]]; then
            if [[ -z "$issue_fp" || "$issue_fp" != "$current_fp" ]]; then
              should=true
            fi
          fi
          echo "should_fix=$should" >> "$GITHUB_OUTPUT"

  # READ-ONLY job: no publishing credential exists anywhere on this runner, and the
  # job's GITHUB_TOKEN can't write. Untrusted code (build scripts, proc macros) runs
  # here under `cargo build`/`cargo test`, so nothing on this runner is trusted after
  # that point — results leave only via an artifact that the publish job validates.
  ai-fix:
    needs: detect
    if: needs.detect.outputs.should_fix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # No credential is written to .git/config: cargo build scripts run
          # arbitrary code and must not be able to read a token.
          persist-credentials: false

      # cargo-deny-action doesn't expose a raw binary for interactive use, so the
      # fix job installs the CLI directly - Claude needs to re-run `cargo deny check`
      # itself, iteratively, while it works. Pinned to the same version as the detect
      # job (and the PR-time gate's bundled binary) so results and CLI syntax match:
      # `--config` is a `check` argument in 0.18.x but moved to a top-level argument
      # in later releases. Bump all together.
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-deny@0.18.6

      # Each workspace can pin its own toolchain via a rust-toolchain file, which
      # rustup resolves from the CURRENT DIRECTORY (walking up), not from
      # --manifest-path. Install the right one up front; Claude is likewise told to
      # run all cargo commands from the workspace directory.
      - name: Install the workspace's pinned Rust toolchain
        working-directory: ${{ needs.detect.outputs.workspace_dir }}
        run: rustup toolchain install

      - name: Configure git identity for commits
        run: |
          git config user.name "cargo-deny-bot"
          git config user.email "cargo-deny-bot@users.noreply.github.com"
          # A build script could plant .git/hooks/* during cargo build; Claude's
          # later `git commit` must not execute it with the API key present.
          git config core.hooksPath /dev/null

      - name: Create local working branch (skipped in dry-run)
        if: ${{ !inputs.dry-run }}
        run: |
          branch="cargo-deny-fix/${{ needs.detect.outputs.workspace_slug }}/wip"
          git checkout -b "$branch"
          echo "BRANCH_NAME=$branch" >> "$GITHUB_ENV"

      - name: Load optional repo-specific instructions
        id: extra_instructions
        run: |
          path="${{ inputs.extra-instructions-path }}"
          if [[ -f "$path" ]]; then
            {
              echo "content<<CARGO_DENY_EOF"
              cat "$path"
              echo "CARGO_DENY_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "content=" >> "$GITHUB_OUTPUT"
          fi

      # Bash subprocesses inherit the Claude process environment, which necessarily
      # holds the Anthropic API key — and cargo build scripts / proc macros execute
      # arbitrary code. This PATH-shadowing wrapper strips credential variables from
      # every cargo invocation Claude makes, so they never reach build scripts.
      # Known bypasses are closed elsewhere: `rustup run <tc> cargo` would skip the
      # wrapper, so rustup is not in allowedTools (the toolchain is pre-installed
      # above); `git -c alias.x='!cmd' x` would exec with the original environment,
      # so git is scoped to explicit subcommands; a hook planted in .git/hooks by a
      # build script would fire on Claude's own `git commit`, so core.hooksPath is
      # neutralized in the identity step above.
      # Still defense in depth, not a guarantee: same-UID code can read
      # /proc/<pid>/environ of the Claude process itself. Mitigate the residual risk
      # by using a dedicated, spend-capped workspace API key for this workflow, and
      # prefer short-lived credentials (Anthropic workload identity federation) once
      # available to the org.
      - name: Shield credentials from cargo subprocesses
        run: |
          real_cargo="$(command -v cargo)"
          mkdir -p "$RUNNER_TEMP/toolwrap"
          printf '#!/usr/bin/env bash\nexec env -u ANTHROPIC_API_KEY -u CLAUDE_CODE_OAUTH_TOKEN -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL %q "$@"\n' \
            "$real_cargo" > "$RUNNER_TEMP/toolwrap/cargo"
          chmod +x "$RUNNER_TEMP/toolwrap/cargo"
          # GITHUB_PATH entries are prepended, so the wrapper shadows ~/.cargo/bin/cargo
          echo "$RUNNER_TEMP/toolwrap" >> "$GITHUB_PATH"

      # Claude works OFFLINE: no gh in allowedTools and no write-capable token —
      # github_token below is this job's read-only GITHUB_TOKEN, used by the action
      # itself for GitHub API reads.
      - name: Resolve cargo-deny findings with Claude
        uses: anthropics/claude-code-action@1298632ce7736903d02a1435002705aa2a594a6c # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: |
            --max-turns ${{ inputs.max-turns }}
            --model ${{ inputs.model }}
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(cd:*),Bash(cargo:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git restore:*)"
          prompt: |
            You are diagnosing and (unless told otherwise below) fixing `cargo deny
            check` failures for the workspace at ${{ inputs.manifest-path }} in this
            repository. Work autonomously: no human is watching this session, so be
            conservative and legible rather than clever. Only touch files relevant to
            this workspace (the manifest, its lockfile, and its deny.toml) — do not
            touch other workspaces in this repo. Note: the deny.toml may be shared by
            several workspaces (it is wherever `--config` points, possibly the repo
            root) — if so, any ignore/skip entry you add silences that finding in
            EVERY workspace, so be extra reluctant to add one and call it out
            explicitly in your report if you do.

            You have no write-capable GitHub credentials: do not push and do not try
            to use the gh CLI. Publication (PR or tracking issue) is handled by a
            separate job after you finish, from the report files you write in Step 4.

            Run ALL cargo commands from the workspace directory
            (`cd ${{ needs.detect.outputs.workspace_dir }}`): each workspace pins its
            own Rust toolchain via a rust-toolchain file, and rustup resolves that
            file from the current directory, NOT from --manifest-path.

            MODE: ${{ inputs.dry-run && 'DRY RUN - diagnose only, do not commit' || 'FIX - diagnose and commit fixes' }}

            ## Step 0: Match this repo's existing conventions
            If a deny.toml already exists for this workspace, check whether its
            `advisories.ignore` list has an established comment style (e.g.
            `"RUSTSEC-XXXX-NNNN", # reason`, explaining the specific transitive path
            and why it's not reachable/exploitable here). Match that exact style for
            any new entries — don't introduce a different format. Also check for an
            AGENTS.md or CLAUDE.md at the repo root and follow any conventions there.

            ## Step 1: Understand the failures
            From the workspace directory, run
            `cargo deny ${{ inputs.deny-arguments }} check ${{ inputs.deny-action-args }}`
            (the exact arguments CI uses, so your results match the failing check) and
            read the output carefully. cargo-deny failures fall into four categories,
            and each needs a different response:

            - **advisories** (RUSTSEC security/unmaintained warnings)
            - **bans** (duplicate dependency versions, explicitly banned crates)
            - **licenses** (a dependency's license isn't in the allow-list)
            - **sources** (dependency pulled from an unapproved registry/git source)

            ## Step 2: Fix what is safely fixable (skip this step entirely in DRY RUN mode - just describe what you *would* do)
            - **advisories with an available patched version**: run
              `cargo update -p <crate>` (or bump the version in the workspace's
              Cargo.toml if the fix requires a semver-major jump) and run the test
              suite to confirm nothing broke.
            - **bans / duplicate versions**: try to unify versions via
              `cargo update -p <crate> --precise <version>` across the dependency tree
              first. Only add a `skip`/`skip-tree` entry to deny.toml as a last resort,
              and if you do, add an inline comment explaining exactly why it's needed
              and which crates still require the older version.
            - Always re-run
              `cargo deny ${{ inputs.deny-arguments }} check ${{ inputs.deny-action-args }}`
              and `cargo build` (and `cargo test` if the change touched Cargo.lock in
              a way that could affect behavior, e.g. a major version bump) from the
              workspace directory before considering something fixed.

            ## Step 3: Do NOT silently resolve policy decisions
            These require human judgment, not an autonomous edit:
            - **A disallowed license with no drop-in alternative crate.** Do not add the
              license to deny.toml's allow-list yourself. Leave it failing, and clearly
              document it in your report under "Needs human review" with the crate,
              its license, and why no alternative was found.
            - **An advisory with no available fix** (no patched version exists upstream).
              Do not add an `ignore` entry to deny.toml yourself. Document it in your
              report instead, including the RUSTSEC ID and a link, so a human can
              decide whether to accept the risk and add the ignore with a tracking issue.
            - **Any unapproved source/registry.** Never add it to the allow-list; flag it.

            If you hit one of these, it is a correct and complete outcome to leave that
            specific finding unresolved and clearly flagged — do not force a fix that
            papers over a real decision.

            ## Step 4: Report your work
            Write two files at the repository root. Do NOT commit them — leave them
            untracked; the workflow reads them after you finish and handles all
            publication:

            - `cargo-deny-report.md`: a markdown body suitable as a PR description
              (FIX mode with fixes) or a tracking issue (DRY RUN, or nothing safely
              fixable): every finding, what you did — or would do — for each, and a
              distinct "Needs human review" section for anything from Step 3 (omit
              the section entirely if everything was resolved).
            - `cargo-deny-report.json`: exactly this shape —
              `{"already_green": false, "needs_security_review": false, "needs_license_review": false}`
              - `already_green`: true only if `cargo deny check` passed on your very
                first run (transient failure); the workflow then publishes nothing.
              - `needs_security_review`: true if any advisory was left unresolved
                for a human (Step 3).
              - `needs_license_review`: true if any license or source finding was
                left unresolved for a human (Step 3).

            If MODE is FIX:
            - You are already on a local working branch created for this run
              (`${{ env.BRANCH_NAME }}`) — do not create another branch. Commit your
              fixes to it in small, clear commits (e.g.
              "cargo update: bump `tokio` to 1.x for RUSTSEC-2026-XXXX"). Do not push.
            - If every finding is a Step 3 policy decision (nothing safely fixable),
              make no commits — the workflow will open a tracking issue from your
              report instead of a PR.

            If MODE is DRY RUN:
            - Make no commits at all; only write the two report files.
            ${{ steps.extra_instructions.outputs.content != '' && format('

            ## Additional repo-specific instructions
            {0}', steps.extra_instructions.outputs.content) || '' }}

      - name: Package results for the publish job
        run: |
          if [[ ! -f cargo-deny-report.json || ! -f cargo-deny-report.md ]]; then
            echo "::error::Claude did not produce cargo-deny-report.json / cargo-deny-report.md"
            exit 1
          fi
          mkdir -p /tmp/cargo-deny-out/patches
          cp cargo-deny-report.md cargo-deny-report.json /tmp/cargo-deny-out/
          if [[ "${{ inputs.dry-run }}" != "true" ]]; then
            count=$(git rev-list --count "${GITHUB_SHA}..HEAD")
            if [[ "$count" -gt 0 ]]; then
              git format-patch "${GITHUB_SHA}" -o /tmp/cargo-deny-out/patches
            fi
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-deny-ai-fix-${{ needs.detect.outputs.workspace_slug }}
          path: /tmp/cargo-deny-out
          if-no-files-found: error
          retention-days: 7

  # Fresh runner: no untrusted code has executed here, so no planted git hooks or
  # lingering processes can observe the publishing credential. Only this job holds it.
  publish:
    needs: [detect, ai-fix]
    if: needs.detect.outputs.should_fix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # label creation via the job token; pushes/PRs/issues use the publishing credential
    env:
      USE_GH_APP: ${{ secrets.GH_APP_ID != '' && secrets.GH_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Require a publishing credential (GitHub App or PAT)
        env:
          HAS_CRED: ${{ (secrets.GH_APP_ID != '' && secrets.GH_APP_PRIVATE_KEY != '') || secrets.GH_PAT != '' }}
        run: |
          if [[ "$HAS_CRED" != "true" ]]; then
            echo "::error::No publishing credential: pass GH_APP_ID + GH_APP_PRIVATE_KEY (preferred) or GH_PAT."
            exit 1
          fi

      # Short-lived, repository-scoped installation token — expires when the job ends
      # and is far safer than a long-lived PAT.
      - name: Mint GitHub App installation token (preferred credential)
        id: app_token
        if: env.USE_GH_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-deny-ai-fix-${{ needs.detect.outputs.workspace_slug }}
          path: /tmp/cargo-deny-out

      # Belt and braces: this is a fresh checkout with no hooks, but neutralize the
      # hook path anyway so nothing can run during git am / git push.
      - name: Disable git hooks and set identity
        run: |
          git config core.hooksPath /dev/null
          git config user.name "cargo-deny-bot"
          git config user.email "cargo-deny-bot@users.noreply.github.com"

      - name: Ensure workspace-scoped labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "cargo-deny-fix" --color "1D76DB" --description "Automated cargo-deny fix PR" 2>/dev/null || true
          gh label create "cargo-deny-diagnosis" --color "0E8A16" --description "AI diagnosis issue: dry-run, or findings that need a human decision" 2>/dev/null || true
          gh label create "workspace:${{ needs.detect.outputs.workspace_slug }}" --color "5319E7" 2>/dev/null || true
          gh label create "needs-security-review" --color "B60205" --description "AI left an advisory unresolved for a human to decide" 2>/dev/null || true
          gh label create "needs-license-review" --color "B60205" --description "AI left a license finding unresolved for a human to decide" 2>/dev/null || true

      - name: Publish results (PR for patches, tracking issue otherwise)
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GH_PAT }}
          SLUG: ${{ needs.detect.outputs.workspace_slug }}
          WS_DIR: ${{ needs.detect.outputs.workspace_dir }}
          MANIFEST: ${{ inputs.manifest-path }}
          DRY_RUN: ${{ inputs.dry-run }}
          FP: ${{ needs.detect.outputs.fingerprint }}
        run: |
          out=/tmp/cargo-deny-out
          already_green=$(jq -r '.already_green' "$out/cargo-deny-report.json")
          needs_sec=$(jq -r '.needs_security_review' "$out/cargo-deny-report.json")
          needs_lic=$(jq -r '.needs_license_review' "$out/cargo-deny-report.json")

          if [[ "$already_green" == "true" ]]; then
            echo "cargo-deny was already green when Claude looked; publishing nothing."
            exit 0
          fi

          # Embedded fingerprint lets the detect gate tell "this issue already covers
          # exactly these findings" from "the finding set changed, re-run".
          printf '\n\n<!-- cargo-deny-fingerprint: %s -->\n' "$FP" >> "$out/cargo-deny-report.md"

          extra_create=()
          extra_edit=()
          if [[ "$needs_sec" == "true" ]]; then
            extra_create+=(--label needs-security-review)
            extra_edit+=(--add-label needs-security-review)
          fi
          if [[ "$needs_lic" == "true" ]]; then
            extra_create+=(--label needs-license-review)
            extra_edit+=(--add-label needs-license-review)
          fi

          shopt -s nullglob
          patches=("$out"/patches/*.patch)

          if [[ "$DRY_RUN" != "true" && ${#patches[@]} -gt 0 ]]; then
            branch="cargo-deny-fix/${SLUG}/$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$branch"
            git am "${patches[@]}"

            # The AI job is untrusted: refuse patches that reach outside the
            # workspace (or a deny.toml policy file) — e.g. workflow files.
            # --no-renames: rename detection would otherwise report only the
            # destination path, letting a rename smuggle a deletion outside the
            # boundary (e.g. .github/workflows/x.yml -> core/x.yml).
            if [[ "$WS_DIR" == "." ]]; then
              allowed='.'
            else
              allowed="^(${WS_DIR}/|deny\.toml$)"
            fi
            bad=$(git diff --no-renames --name-only "${GITHUB_SHA}..HEAD" | grep -Ev "$allowed" || true)
            if [[ -n "$bad" ]]; then
              echo "::error::AI patch touches files outside the workspace: $bad"
              exit 1
            fi

            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
            gh pr create \
              --head "$branch" \
              --title "fix(${SLUG}): resolve cargo-deny findings" \
              --body-file "$out/cargo-deny-report.md" \
              --label cargo-deny-fix --label "workspace:${SLUG}" \
              "${extra_create[@]}"
          else
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label "cargo-deny-diagnosis" --label "workspace:${SLUG}" \
              --json number --jq '.[0].number // empty')
            if [[ -n "$existing" ]]; then
              # Reset both review labels first so a finding set that changed
              # category (e.g. security -> license-only) doesn't keep the issue in
              # the wrong review queue; then re-add what the new report warrants.
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" \
                --remove-label needs-security-review --remove-label needs-license-review \
                >/dev/null 2>&1 || true
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" \
                --body-file "$out/cargo-deny-report.md" "${extra_edit[@]}"
              echo "Updated diagnosis issue #$existing"
            else
              gh issue create \
                --title "[cargo-deny] diagnosis for ${MANIFEST}" \
                --body-file "$out/cargo-deny-report.md" \
                --label cargo-deny-diagnosis --label "workspace:${SLUG}" \
                "${extra_create[@]}"
            fi
          fi
