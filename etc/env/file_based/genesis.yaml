prover:
  # Keccak hash of the Airbender SNARK-wrapper verification key (it commits to the wrapped
  # guest program, so it identifies the whole prover release). Airbender provers report this
  # hash when polling for jobs and only receive batches of protocol versions it is registered
  # for. Must match the verifier release pinned by `airbender_prover_server` (build.rs tag)
  # and the `AirbenderVerifierPlonk` deployed on L1; the prover server logs the hash at
  # startup ("Computed SNARK-wrapper VK hash") — update this value when bumping the release.
  airbender_snark_wrapper_vk_hash: '0xd8176dea8eb7277c3c7ac5c40bfce0b59cd6edfcaa9fff3b06cda5e4aebfdf4c'
