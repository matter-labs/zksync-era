name: Cargo license check
on: pull_request
jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: EmbarkStudios/cargo-deny-action@76cd80eb775d7bbbd2d80292136d74d39e1b4918 # v2.0.11
      with:
        manifest-path: "./core/Cargo.toml"
        command: check
        # --config points at the shared root deny.toml: cargo-deny doesn't auto-discover
        # it from nested workspaces, and in cargo-deny 0.18.x (bundled by the action)
        # --config is a `check` argument whose relative path resolves from the workspace
        # root directory (core/), hence ../deny.toml.
        command-arguments: "--config ../deny.toml --allow unmaintained --hide-inclusion-graph"
