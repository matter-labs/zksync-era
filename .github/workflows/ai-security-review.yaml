# Engine documentation: https://github.com/matter-labs/zksync-ci-common/blob/a0d18463bb8b79e58a9f62eda0f6f99e1c6577df/ai-security-review/README.md
name: AI Security Review

on:
    pull_request:
        types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
    group: ai-security-review-caller-${{ github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    security-review:
        name: Security review
        if: >-
            github.event.pull_request.head.repo.full_name == github.repository &&
            !github.event.pull_request.draft &&
            github.event.pull_request.user.type == 'User' &&
            github.event.sender.type == 'User' &&
            !endsWith(github.actor, '[bot]')
        permissions:
            contents: read
            pull-requests: write
            # Required by the reusable engine, including API-key authentication.
            id-token: write
        uses: matter-labs/zksync-ci-common/.github/workflows/ai-security-review.yaml@a0d18463bb8b79e58a9f62eda0f6f99e1c6577df
        with:
            maximum_batches: 24
            fail_on_findings: false
        secrets:
            ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
